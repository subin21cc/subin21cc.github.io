<!--
  Desktop sidebar collapse (state kept in localStorage).
  Reuses the theme's own hamburger button (#sidebar-trigger in the top bar): below 850px the
  theme opens the sidebar as an overlay; from 850px up we take over the click and collapse it.
-->
<script>
  (function () {
    var KEY = 'sidebar-collapsed';
    var ATTR = 'data-sidebar-collapsed';
    var root = document.documentElement;
    var desktop = window.matchMedia('(min-width: 850px)');

    function sync() {
      var btn = document.getElementById('sidebar-trigger');
      if (btn) {
        btn.setAttribute('aria-expanded', String(!root.hasAttribute(ATTR)));
      }
    }

    /* apply the saved state before the first paint to avoid a flash */
    try {
      if (localStorage.getItem(KEY) === '1') {
        root.setAttribute(ATTR, '');
      }
    } catch (e) {}

    /* capture phase on document: runs before the theme's handler on the button */
    document.addEventListener(
      'click',
      function (e) {
        if (!desktop.matches || !e.target.closest('#sidebar-trigger')) {
          return;
        }
        e.stopPropagation();
        root.toggleAttribute(ATTR);
        try {
          localStorage.setItem(KEY, root.hasAttribute(ATTR) ? '1' : '0');
        } catch (err) {}
        sync();
      },
      true
    );

    document.addEventListener('DOMContentLoaded', sync);
  })();
</script>
